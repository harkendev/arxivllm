[project]
name = "arxivllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=2.2.0",
    "pydantic-ai>=0.1.6",
    "pydantic-evals>=0.1.6",
    "typer>=0.15.2",
]

[dependency-groups]
dev = [
    "anyio>=4.9.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.7",
]

[project.scripts]
arxivllm = "arxivllm.main:app"